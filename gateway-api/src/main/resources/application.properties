spring.application.name=gateway-api
server.port=8080

# ---------- Configuração centralizada (Consul KV: config/gateway-api/...) ----------
# Único dado local = endereço do Consul; jwt.secret vem SEMPRE do Consul (nenhum segredo no código).
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.config.import=consul:

# Registro no Consul: IP configurável (local = 127.0.0.1; Docker = IP do container via SERVICE_IP)
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.ip-address=${SERVICE_IP:127.0.0.1}

# ---------- Observabilidade ----------
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
# traceId/spanId em todo log (correlação logs <-> traces)
logging.pattern.correlation=[${spring.application.name},%X{traceId:-},%X{spanId:-}]
