global:
  scrape_interval: 10s
scrape_configs:
  - job_name: athlex
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-api:8080"]
        labels: { application: gateway-api }
      - targets: ["auth-api:8200"]
        labels: { application: auth-api }
      - targets: ["product-api:8100"]
        labels: { application: product-api }
      - targets: ["order-api:8400"]
        labels: { application: order-api }
