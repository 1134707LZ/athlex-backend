spring.application.name=auth-api
server.port=8200

# ---------- Configuração centralizada (Consul KV: config/auth-api/...) ----------
# Único dado local = endereço do Consul; datasource e jwt.secret vêm SEMPRE do Consul (nenhum segredo no código).
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.config.import=consul:

# Registro no Consul: IP configurável (local = 127.0.0.1; Docker = IP do container via SERVICE_IP)
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.ip-address=${SERVICE_IP:127.0.0.1}

jwt.expiration-minutes=120

# ---------- Banco: migrações versionadas (Flyway) ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ---------- Observabilidade ----------
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
# traceId/spanId em todo log (correlação logs <-> traces)
logging.pattern.correlation=[${spring.application.name},%X{traceId:-},%X{spanId:-}]
